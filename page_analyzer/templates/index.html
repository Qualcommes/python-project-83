{% extends "base.html" %}

{% block content %}
<div class="container-lg mt-5">
  <div class="row">
    <div class="col-12 col-md-10 col-lg-8 mx-auto text-center">
      <div class="card bg-dark text-white p-5 shadow-sm rounded">
        <h1 class="display-3 mb-3">Анализатор страниц</h1>
        <p class="lead mb-4">Бесплатно проверяйте сайты на SEO пригодность</p>
        
        <form action="{{ url_for('add_url') }}" method="post" class="d-flex justify-content-center">
          <input 
            type="text" 
            name="url" 
            placeholder="https://www.example.com" 
            value="{{ url_value if url_value else '' }}"
            class="form-control form-control-lg me-2" 
            required
          >
          <input 
            type="submit" 
            class="btn btn-primary btn-lg text-uppercase fw-bold" 
            value="Проверить"
          >
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
