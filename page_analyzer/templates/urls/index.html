{% extends "base.html" %}

{% block content %}
<div class="container-lg mt-5">
  <h1>Сайты</h1>
  <div class="table-responsive">
    <table class="table table-bordered table-hover mt-3" data-test="urls">
      <thead>
        <tr>
          <th>ID</th>
          <th>Имя</th>
          <th>Последняя проверка</th>
          <th>Код ответа</th>
        </tr>
      </thead>
      <tbody>
        {% for url in urls %}
          <tr>
            <td>{{ url.id }}</td>
            <td>
              <a href="{{ url_for('show_url', id=url.id) }}">{{ url.name }}</a>
            </td>
            <td>{{ url.last_check if url.last_check else '' }}</td>
            <td>{{ url.status_code if url.status_code else '' }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
